<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="VANTERA MOTORS">
  <title>VANTERA MOTORS</title>
  <style>
    .mark-v { fill: none; stroke: currentColor; stroke-width: 5; stroke-linejoin: miter; stroke-linecap: butt; }
    .mark-streak { fill: #C1121F; }
    .word { font-family: 'Oswald', 'Arial Narrow', Impact, sans-serif; font-weight: 600; fill: currentColor; }
    .sub { font-family: 'Inter', Arial, sans-serif; font-weight: 500; fill: currentColor; opacity: .7; }
  </style>
  <g color="#F2EFE8" style="color:#F2EFE8">
    <!-- Emblem: a V built from two blades, with a red speed streak cutting through it -->
    <g transform="translate(6 8)">
      <path class="mark-v" d="M4 6 L32 62 L60 6" />
      <path class="mark-v" d="M17 6 L32 36 L47 6" opacity=".55" />
      <path class="mark-streak" d="M0 40 L30 40 L36 46 L0 46 Z" />
    </g>
    <text class="word" x="84" y="42" font-size="34" letter-spacing="7">VANTERA</text>
    <text class="sub" x="86" y="62" font-size="11" letter-spacing="9.5">MOTORS</text>
  </g>
</svg>
